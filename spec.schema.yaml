$schema: "https://json-schema.org/draft/2020-12/schema"
title: "NorthBound Client Site Spec"
type: object
additionalProperties: false
required:
  - client
  - package
  - run_id
  - brand
  - pages
  - images
  - integrations
  - seo
  - constraints
properties:
  client:
    type: string
    minLength: 1
  package:
    type: string
    minLength: 1
  run_id:
    type: string
    minLength: 1

  brand:
    type: object
    additionalProperties: false
    required: [logo, colors, type]
    properties:
      logo:
        type: string
        minLength: 1
      colors:
        type: object
        additionalProperties: false
        required: [primary, accent, ink, paper]
        properties:
          primary: { $ref: "#/$defs/hexColor" }
          accent: { $ref: "#/$defs/hexColor" }
          ink: { $ref: "#/$defs/hexColor" }
          paper: { $ref: "#/$defs/hexColor" }
      type:
        type: object
        additionalProperties: false
        required: [head, body]
        properties:
          head: { type: string, minLength: 1 }
          body: { type: string, minLength: 1 }

  pages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [slug, title, sections]
      properties:
        slug:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        seo:
          $ref: "#/$defs/pageSeoObject"
        sections:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/section"

  images:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [status, alt]
      properties:
        status:
          type: string
          enum: [have, need, replace, rejected]
        alt:
          type: string

  integrations:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      additionalProperties: true

  seo:
    $ref: "#/$defs/globalSeoObject"

  constraints:
    type: object
    additionalProperties: false
    required: [max_review_rounds, go_live_date]
    properties:
      max_review_rounds:
        type: integer
        minimum: 1
      go_live_date:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        format: date

$defs:
  globalSeoObject:
    type: object
    additionalProperties: false
    required: [description]
    properties:
      description: { type: string }
      og_image: { type: string }

  pageSeoObject:
    type: object
    additionalProperties: false
    properties:
      description: { type: string }
      og_image: { type: string }

  hexColor:
    type: string
    pattern: "^#[0-9A-Fa-f]{6}$"

  section:
    oneOf:
      - $ref: "#/$defs/heroSection"
      - $ref: "#/$defs/servicesGridSection"
      - $ref: "#/$defs/proofSection"
      - $ref: "#/$defs/contactCtaSection"
      - $ref: "#/$defs/faqSection"
      - $ref: "#/$defs/testimonialSection"
      - $ref: "#/$defs/gallerySection"

  heroSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: hero }
      copy:
        type: object
        additionalProperties: false
        required: [head, sub, cta]
        properties:
          head: { type: string }
          sub: { type: string }
          cta: { type: string }
      images:
        type: array
        items: { type: string }

  servicesGridSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: services-grid }
      copy:
        type: object
        additionalProperties: false
        required: [head, items]
        properties:
          head: { type: string }
          items:
            type: array
            minItems: 1
            items: { type: string }
      images:
        type: array
        items: { type: string }

  proofSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: proof }
      copy:
        type: object
        additionalProperties: false
        required: [head, stats]
        properties:
          head: { type: string }
          stats:
            type: array
            minItems: 1
            items: { type: string }
      images:
        type: array
        items: { type: string }

  contactCtaSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: contact-cta }
      copy:
        type: object
        additionalProperties: false
        required: [head, sub]
        properties:
          head: { type: string }
          sub: { type: string }
      images:
        type: array
        items: { type: string }

  faqSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: faq }
      copy:
        type: object
        additionalProperties: false
        required: [head, items]
        properties:
          head: { type: string }
          items:
            type: array
            minItems: 1
            items: { type: string }
      images:
        type: array
        items: { type: string }

  testimonialSection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: testimonial }
      copy:
        type: object
        additionalProperties: false
        required: [head, quote, author]
        properties:
          head: { type: string }
          quote: { type: string }
          author: { type: string }
      images:
        type: array
        items: { type: string }

  gallerySection:
    type: object
    additionalProperties: false
    required: [type, copy, images]
    properties:
      type: { const: gallery }
      copy:
        type: object
        additionalProperties: false
        required: [head]
        properties:
          head: { type: string }
      images:
        type: array
        minItems: 1
        items: { type: string }
